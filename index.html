<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>結婚式準備チェックリストプランナー</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-pink-950 via-rose-900 to-red-900 min-h-screen text-white">
  <div class="max-w-3xl mx-auto px-4 py-8">
    <!-- Header -->
    <div class="text-center mb-8">
      <div class="text-5xl mb-3">💍</div>
      <h1 class="text-3xl font-bold text-pink-300 mb-2">結婚式準備チェックリスト</h1>
      <p class="text-rose-200 text-sm">ふたりの特別な日に向けて — 全工程を漏れなく管理</p>
    </div>

    <!-- Overall Progress -->
    <div class="bg-pink-900/50 rounded-2xl p-5 mb-6 border border-pink-700">
      <div class="flex justify-between items-center mb-3">
        <h2 class="text-lg font-semibold text-pink-300">全体進捗</h2>
        <span id="overall-pct" class="text-2xl font-bold text-yellow-400">0%</span>
      </div>
      <div class="bg-pink-800/50 rounded-full h-4 mb-2">
        <div id="overall-bar" class="bg-gradient-to-r from-pink-400 to-rose-400 h-4 rounded-full transition-all duration-500" style="width:0%"></div>
      </div>
      <div id="overall-counts" class="text-xs text-pink-300 text-right">0 / 0 項目完了</div>
    </div>

    <!-- Date Setting -->
    <div class="bg-pink-900/50 rounded-2xl p-4 mb-6 border border-pink-700">
      <div class="flex gap-4 items-center flex-wrap">
        <div class="flex-1 min-w-48">
          <label class="text-sm text-pink-300 block mb-1">挙式予定日</label>
          <input type="date" id="wedding-date"
            class="bg-pink-800/60 border border-pink-500 rounded-xl px-4 py-2 text-white w-full focus:outline-none focus:border-pink-300" />
        </div>
        <div id="days-until" class="text-center bg-pink-800/40 rounded-xl p-3 flex-shrink-0 min-w-28">
          <div class="text-xs text-pink-300 mb-1">挙式まで</div>
          <div id="days-count" class="text-2xl font-bold text-yellow-400">—</div>
          <div class="text-xs text-pink-300">日</div>
        </div>
      </div>
    </div>

    <!-- Categories -->
    <div id="categories-container" class="space-y-4 mb-6">
      <!-- Generated by JS -->
    </div>

    <!-- Notes Section -->
    <div class="bg-pink-900/50 rounded-2xl p-5 border border-pink-700">
      <h2 class="text-lg font-semibold text-pink-300 mb-3">📝 メモ</h2>
      <textarea id="notes" rows="4"
        class="w-full bg-pink-800/60 border border-pink-500 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-pink-300 resize-none"
        placeholder="担当者・連絡先・気になること等をメモ..."
        oninput="saveNotes()"></textarea>
    </div>

    <p class="text-center text-pink-400/50 text-xs mt-6">データはブラウザに自動保存されます</p>
  </div>

  <script>
    var checklistData = [
      {
        id: 'venue',
        name: '会場選び',
        icon: '🏰',
        color: 'pink',
        items: [
          '式場の候補リストを作成する',
          '式場見学（最低3会場）を予約・訪問',
          '式場を決定し仮予約する',
          '契約書を確認・署名する',
          '会場のコーディネーターと顔合わせ',
          '会場レイアウト・装花イメージを決定',
          '音響・照明プランを確認する',
          '駐車場・アクセス情報をゲストに案内する'
        ]
      },
      {
        id: 'invitation',
        name: '招待状',
        icon: '✉️',
        color: 'rose',
        items: [
          '招待ゲストリストを作成する（両家で確認）',
          '招待状のデザインを選ぶ・発注する',
          '宛名書きを完成させる',
          '返信期限を設定して招待状を発送する（3ヶ月前目安）',
          '返信はがきの集計・出席者確認',
          '食物アレルギー・特別配慮の確認',
          '席次表のドラフトを作成する',
          '席次表・席札を印刷・発注する'
        ]
      },
      {
        id: 'attire',
        name: '衣装',
        icon: '👗',
        color: 'fuchsia',
        items: [
          '花嫁衣装の試着（和装・洋装）',
          '花婿衣装の試着・決定',
          '衣装レンタル・購入の契約',
          'アクセサリー（ティアラ・ブーケ等）の選定',
          '試着・フィッティング（本番前2回）',
          'ヘアメイクの事前相談・リハーサル',
          '両家の親の衣装確認',
          '衣装搬入日・返却日の確認'
        ]
      },
      {
        id: 'food',
        name: '料理・ケーキ',
        icon: '🎂',
        color: 'orange',
        items: [
          '料理の試食会に参加する',
          'コース内容・価格を決定する',
          'ウェディングケーキのデザインを決定',
          'アレルギー対応メニューの手配',
          'ドリンクメニュー・フリードリンクの確認',
          '子ども・高齢者向け特別メニューの確認'
        ]
      },
      {
        id: 'photo',
        name: '写真・動画',
        icon: '📷',
        color: 'violet',
        items: [
          'フォトグラファーを選定・契約する',
          'ビデオグラファーを選定・契約する（任意）',
          '前撮り・フォトウェディングの実施',
          '式当日の撮影プランを確認する',
          'ゲストへの写真共有方法を決める',
          'アルバム・フォトブックの発注',
          'SNS公開ポリシーをゲストと共有する'
        ]
      },
      {
        id: 'honeymoon',
        name: 'ハネムーン',
        icon: '✈️',
        color: 'sky',
        items: [
          'ハネムーン先の候補を決める',
          'パスポートの有効期限を確認する',
          '航空券・ホテルを予約する（早めに）',
          '旅行保険に加入する',
          '現地の通貨・クレカを準備する',
          '両家への挨拶・留守番の確認',
          '式当日に荷物を別に預けておく手配',
          'ハネムーンの持ち物リストを作成する'
        ]
      }
    ];

    var colorMap = {
      pink: { bg: 'bg-pink-900/50', border: 'border-pink-700', header: 'text-pink-300', bar: 'bg-pink-400', light: 'bg-pink-800/40', check: 'bg-pink-500' },
      rose: { bg: 'bg-rose-900/50', border: 'border-rose-700', header: 'text-rose-300', bar: 'bg-rose-400', light: 'bg-rose-800/40', check: 'bg-rose-500' },
      fuchsia: { bg: 'bg-fuchsia-900/50', border: 'border-fuchsia-700', header: 'text-fuchsia-300', bar: 'bg-fuchsia-400', light: 'bg-fuchsia-800/40', check: 'bg-fuchsia-500' },
      orange: { bg: 'bg-orange-900/50', border: 'border-orange-700', header: 'text-orange-300', bar: 'bg-orange-400', light: 'bg-orange-800/40', check: 'bg-orange-500' },
      violet: { bg: 'bg-violet-900/50', border: 'border-violet-700', header: 'text-violet-300', bar: 'bg-violet-400', light: 'bg-violet-800/40', check: 'bg-violet-500' },
      sky: { bg: 'bg-sky-900/50', border: 'border-sky-700', header: 'text-sky-300', bar: 'bg-sky-400', light: 'bg-sky-800/40', check: 'bg-sky-500' }
    };

    function getCheckedState() {
      return JSON.parse(localStorage.getItem('wedding-checked') || '{}');
    }

    function saveChecked(state) {
      localStorage.setItem('wedding-checked', JSON.stringify(state));
    }

    function toggleItem(catId, itemIdx) {
      var state = getCheckedState();
      var key = catId + '-' + itemIdx;
      state[key] = !state[key];
      saveChecked(state);
      renderAll();
    }

    function renderAll() {
      var state = getCheckedState();
      var container = document.getElementById('categories-container');
      container.innerHTML = '';
      var totalItems = 0;
      var totalChecked = 0;

      checklistData.forEach(function(cat) {
        var c = colorMap[cat.color] || colorMap.pink;
        var checked = 0;
        cat.items.forEach(function(item, i) {
          if (state[cat.id + '-' + i]) checked++;
        });
        totalItems += cat.items.length;
        totalChecked += checked;
        var pct = Math.round((checked / cat.items.length) * 100);

        var section = document.createElement('div');
        section.className = c.bg + ' rounded-2xl border ' + c.border + ' overflow-hidden';

        // Header
        var header = document.createElement('div');
        header.className = 'p-4 cursor-pointer select-none';
        header.onclick = (function(id) { return function() { toggleSection(id); }; })(cat.id);

        var headerRow = document.createElement('div');
        headerRow.className = 'flex items-center gap-3 mb-3';

        var icon = document.createElement('span');
        icon.className = 'text-2xl';
        icon.textContent = cat.icon;

        var title = document.createElement('h3');
        title.className = 'font-bold text-white flex-1';
        title.textContent = cat.name;

        var countBadge = document.createElement('span');
        countBadge.className = 'text-xs ' + c.header;
        countBadge.textContent = checked + '/' + cat.items.length;

        var pctBadge = document.createElement('span');
        pctBadge.className = 'text-xs font-bold text-yellow-300 bg-yellow-500/20 px-2 py-0.5 rounded-full border border-yellow-500/40 ml-1';
        pctBadge.textContent = pct + '%';

        var arrow = document.createElement('span');
        arrow.id = 'arrow-' + cat.id;
        arrow.className = c.header + ' ml-2 transition-transform';
        arrow.textContent = '▼';

        headerRow.appendChild(icon);
        headerRow.appendChild(title);
        headerRow.appendChild(countBadge);
        headerRow.appendChild(pctBadge);
        headerRow.appendChild(arrow);
        header.appendChild(headerRow);

        var barContainer = document.createElement('div');
        barContainer.className = 'bg-pink-800/40 rounded-full h-2';
        var bar = document.createElement('div');
        bar.className = c.bar + ' h-2 rounded-full transition-all duration-500';
        bar.style.width = pct + '%';
        barContainer.appendChild(bar);
        header.appendChild(barContainer);
        section.appendChild(header);

        // Items
        var itemsList = document.createElement('div');
        itemsList.id = 'section-' + cat.id;
        itemsList.className = 'px-4 pb-4 space-y-1 ' + (localStorage.getItem('section-open-' + cat.id) === 'false' ? 'hidden' : '');

        cat.items.forEach(function(item, i) {
          var key = cat.id + '-' + i;
          var isChecked = state[key] || false;
          var itemDiv = document.createElement('div');
          itemDiv.className = c.light + ' rounded-xl p-3 flex items-center gap-3 cursor-pointer hover:opacity-80 transition-all';
          itemDiv.onclick = (function(cId, iIdx) { return function() { toggleItem(cId, iIdx); }; })(cat.id, i);

          var checkBox = document.createElement('div');
          if (isChecked) {
            checkBox.className = c.check + ' w-5 h-5 rounded flex items-center justify-center flex-shrink-0';
            var tick = document.createElement('span');
            tick.className = 'text-white text-xs font-bold';
            tick.textContent = '✓';
            checkBox.appendChild(tick);
          } else {
            checkBox.className = 'w-5 h-5 rounded border-2 border-pink-500/60 flex-shrink-0';
          }

          var label = document.createElement('span');
          label.className = 'text-sm ' + (isChecked ? 'line-through text-pink-400/60' : 'text-white');
          label.textContent = item;

          itemDiv.appendChild(checkBox);
          itemDiv.appendChild(label);
          itemsList.appendChild(itemDiv);
        });

        section.appendChild(itemsList);
        container.appendChild(section);
      });

      // Overall progress
      var overallPct = totalItems > 0 ? Math.round((totalChecked / totalItems) * 100) : 0;
      document.getElementById('overall-pct').textContent = overallPct + '%';
      document.getElementById('overall-bar').style.width = overallPct + '%';
      document.getElementById('overall-counts').textContent = totalChecked + ' / ' + totalItems + ' 項目完了';
    }

    function toggleSection(id) {
      var el = document.getElementById('section-' + id);
      var arrow = document.getElementById('arrow-' + id);
      if (el.classList.contains('hidden')) {
        el.classList.remove('hidden');
        arrow.style.transform = 'rotate(0deg)';
        localStorage.setItem('section-open-' + id, 'true');
      } else {
        el.classList.add('hidden');
        arrow.style.transform = 'rotate(-90deg)';
        localStorage.setItem('section-open-' + id, 'false');
      }
    }

    function saveNotes() {
      localStorage.setItem('wedding-notes', document.getElementById('notes').value);
    }

    function updateCountdown() {
      var dateInput = document.getElementById('wedding-date').value;
      if (!dateInput) {
        document.getElementById('days-count').textContent = '—';
        return;
      }
      var wedding = new Date(dateInput);
      var today = new Date();
      today.setHours(0, 0, 0, 0);
      var diff = Math.ceil((wedding - today) / (1000 * 60 * 60 * 24));
      document.getElementById('days-count').textContent = diff >= 0 ? diff : '過去';
    }

    // Load saved data
    var savedDate = localStorage.getItem('wedding-date');
    var savedNotes = localStorage.getItem('wedding-notes');
    if (savedDate) document.getElementById('wedding-date').value = savedDate;
    if (savedNotes) document.getElementById('notes').value = savedNotes;

    document.getElementById('wedding-date').addEventListener('input', function() {
      localStorage.setItem('wedding-date', this.value);
      updateCountdown();
    });

    updateCountdown();
    renderAll();
  </script>
</body>
</html>
